<div class="content ctr"><div class="bulbs"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></div><h1 id="five-guiding-lights-of-digital-archiving">Five Guiding Lights of Digital Archiving</h1></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;"><div class="content center">
<div class="gl-top"><span class="gl-badge"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></svg></span><span>Guiding Light 1</span></div>
<h1 class="gl-name">LOCKSS</h1>
<p class="gl-statement">Lots of Copies Keep Stuff Safe!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content big">
<h2 id="how-do-we-preserve-ephemeral-resources">How do we preserve ephemeral resources?</h2>
<ul>
<li>2000 Stanford paper and Open Source application by David S. H. Rosenthal and Vicky Reich</li>
<li>Initially for preserving digital-only journals</li>
<li>Eventually adopted as a principal all digital content</li>
<li>Many copies = fixity checks and change over time analysis</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content">
<h2>A Three-Part Problem</h2>
<div class="stair">
<div class="card s1"><h3>1. &quot;The bits themselves must be preserved...&quot;</h3><p>&quot;All digital storage media have a limited lifetime; the bits need to migrate from one medium to another over time.&quot;</p></div>
<div class="card s2"><h3>2. &quot;Access to the bits must be preserved.&quot;</h3><p>&quot;Unless links to pages continue to resolve, the material will effectively be lost because no-one will have the knowledge or patience to retrieve it.&quot;</p></div>
<div class="card rust s3"><h3>3. &quot;The ability to parse the bits, once accessed, into human-readable form must be preserved&quot;</h3><p>This is remediation, taking binary code and making it into a human readable (in contrast to machine readable) expression</p></div>
</div>
<p class="cite-line">Citation: <a href="https://assets.lockss.org/resources/2000-06_Permanent_Web_Publishing.pdf">Permanent Web Publishing (2000), assets.lockss.org</a></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content big">
<h2 id="lockss-26-years-later">LOCKSS 26 Years Later</h2>
<ul>
<li>LOCKSS on as an open source application (<a href="https://github.com/lockss">github</a>)</li>
<li>Repositories like <a href="https://arxiv.org/">Arxiv</a> embody this</li>
<li>Paid &quot;dark archive&quot; services like ITHAKA's <a href="https://www.portico.org/">Portico</a>, Internet Archive's <a href="https://archive-it.org/vault/">Vault</a>, Artefactual Systems' <a href="https://www.archivematica.org/en/">Archivematica</a></li>
<li>Lots of copies gives permanence to digital resources.</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;"><div class="content center">
<div class="gl-top"><span class="gl-badge"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></svg></span><span>Guiding Light 2</span></div>
<h1 class="gl-name">3-2-1</h1>
<div class="trio">
<div><span>3</span>Total Copies!</div>
<div><span>2</span>Different Types!</div>
<div><span>1</span>Offsite Copy!</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content mid">
<h2 id="what-three-copies">What Three Copies?</h2>
<div class="tri">
<div class="card"><span class="bn">1</span><h3>Raws</h3><p>Straight from the camera</p></div>
<div class="card"><span class="bn">2</span><h3>Working</h3><p>Files for editing</p></div>
<div class="card"><span class="bn">3</span><h3>Backup</h3><p>Duplicate files from camera</p></div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content dense"><h2 id="what-different-media-types">What Different Media types?</h2><div class="g22"><div class="cell"><div class="ph" data-slot="media-hard-drive"><small>Image</small>Hard drive</div><div class="lab">Hard drive</div></div><div class="cell"><div class="ph" data-slot="media-server"><small>Image</small>Server</div><div class="lab">Server</div></div><div class="cell"><div class="ph" data-slot="media-disc"><small>Image</small>Disc</div><div class="lab">Disc</div></div><div class="cell"><div class="ph" data-slot="media-tape"><small>Image</small>Tape</div><div class="lab">Tape</div></div></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content dense">
<h2 id="whats-offsite">What's Offsite?</h2>
<div class="two">
<div class="pic-card"><div class="ph" data-slot="offsite-data-center"><small>Image</small>Data center</div><div class="cap"><h3>DATA CENTER</h3><p>Cloud host = AWS</p></div></div>
<div class="pic-card"><div class="ph" data-slot="offsite-cold-tape"><small>Image</small>Cold tape storage</div><div class="cap"><h3>COLD TAPE STORAGE</h3><p>Tape facility = TAPE VENDORS</p></div></div>
</div>
<p class="foot">No vendor? A hard drive at your buddy's house is better than nothing!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content mid">
<h2 id="dam-it">DAM IT!</h2>
<p class="lead"><em>Digital Asset Management Internet Technology</em></p>
<ul>
<li>Digital Asset = important file</li>
<li>Management = Ability to find them quickly</li>
<li>Digital Asset Management System = Database with UI over it that displays metadata</li>
</ul>
<p>3-2-1 coined by Peter Krogh's <a href="https://thedambook.com/"><em>The DAM Book</em></a></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;"><div class="content center">
<div class="gl-top"><span class="gl-badge"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></svg></span><span>Guiding Light 3</span></div>
<h1 class="gl-name">Facsimiles and Born Digitals</h1>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content dense">
<h2 style="font-size:40px">Digital preservationists preserve two types of files.</h2>
<div class="two">
<div class="pic-card card"><div class="ph" data-slot="facsimile"><small>Image</small>Example of a facsimile</div><div class="cap tall"><h3>Facsimiles</h3><p>High-fidelity copy is as true to the original source as possible (<a href="https://en.wikipedia.org/wiki/Facsimile">Wikipedia</a>).</p></div></div>
<div class="pic-card card rust"><div class="ph" data-slot="born-digital"><small>Image</small>Example of a born digital file</div><div class="cap tall"><h3>Born Digital</h3><p>Files created with computers (Nicky)</p></div></div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content mid">
<h2 style="font-size:54px">Digital Production &ne; Digital Preservation</h2>
<div class="cols-60-40">
<div>
<ul>
<li>Imaging means working with <strong>cameras</strong> and <strong>scanners</strong></li>
<li>Some institutions separate this by job role (TCCS does this!)
<ul>
<li>What determines the separation? GUES$!!!!!!</li>
</ul>
</li>
</ul>
</div>
<div class="burst-wrap"><div class="burst">Get imaging experience by using cameras!</div></div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content center big">
<h2 id="non-photographed-facsimiles">Non-Photographed Facsimiles</h2>
<p class="lead">There are other ways to make copies depending on media type.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">

<div class="content mid"><h2 id="born-digital-objects">Born Digital Objects</h2><div class="boxes"><div class="box"><span class="gl-badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span><div class="lbl">Websites</div></div><div class="box"><span class="gl-badge"><svg viewBox="0 0 24 24"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="2"/></svg></span><div class="lbl">Video Games</div></div><div class="box"><span class="gl-badge"><svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span><div class="lbl">Emails</div></div><div class="box"><span class="gl-badge"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></span><div class="lbl">Software</div></div><div class="box"><span class="gl-badge"><svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg></span><div class="lbl">Digital Images</div></div><div class="box"><span class="gl-badge"><svg viewBox="0 0 24 24"><path d="m16 13 5.22 3.48a.5.5 0 0 0 .78-.42V7.94a.5.5 0 0 0-.78-.42L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></span><div class="lbl">Digital Video</div></div><div class="box"><span class="gl-badge"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg></span><div class="lbl">Databases</div></div></div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;"><div class="content center">
<div class="gl-top"><span class="gl-badge"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></svg></span><span>Guiding Light 4</span></div>
<h1 class="gl-name">Open Access(ibility)</h1>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content mid">
<h2 id="free-for-readers">Free for Readers!</h2>
<ul>
<li>Research, publications and resources made available online for free for everyone on the web.</li>
<li>The Budapest Open Access Initiative (<a href="https://www.budapestopenaccessinitiative.org/">BOAI</a>)
<ul>
<li>&quot;The literature that should be freely accessible online is that which scholars give to the world without expectation of payment.&quot;</li>
</ul>
</li>
<li>Peter Suber's Open Access (<a href="https://direct.mit.edu/books/book/3754/Open-Access">MIT</a>)</li>
<li>The web powers the free exchange of information</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content mid">
<h2>Accessible to All!</h2>
<p class="lead">We want our digital archives usable for the blind, deaf, and cognitively impaired.</p>
<p><strong>Web Content Accessibility Guidelines (WCAG)</strong></p>
<div class="defs four">
<div class="card">
<h3 id="perceivable">Perceivable</h3>
<p>Alt Text, Captions, Color Contrast,</p>
</div>
<div class="card">
<h3 id="operable">Operable</h3>
<p>Mouse, keyboard, or breath</p>
</div>
<div class="card">
<h3 id="understandable">Understandable</h3>
<p>Clear, consistent, documented</p>
</div>
<div class="card rust">
<h3 id="robust">Robust</h3>
<p>Works today and in the future</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content huge">
<h2 id="foss">FOSS</h2>
<ul>
<li>Free, open source software</li>
<li>Community Maintained</li>
<li>Source code available</li>
<li>Documented, open standards</li>
</ul>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;"><div class="content center">
<div class="gl-top"><span class="gl-badge"><svg viewBox="0 0 24 24"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></svg></span><span>Guiding Light 5</span></div>
<h1 class="gl-name">Digital Humanities</h1>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content center">
<p class="takeaway">Data is never neutral</p>
<p class="takeaway-cite">From Johanna Drucker's <a href="http://digitalhumanities.org/dhq/vol/5/1/000091/000091.html">“Humanities Approaches to Graphical Display,”</a> <em>Digital Humanities Quarterly</em> 5:1 (2011).</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content big center">
<h2 id="humanities-data">Humanities Data</h2>
<p class="lead">We can apply data science to liberal arts disciplines.</p>
<div class="callout"><p>Words in books as data; colors in paintings as data; notes in music as data.</p></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content imgslide"><h2>TEI</h2><p class="lead">Text Encoding Initiative</p><div class="ph" data-slot="dh-tei"><small>Image</small>Example of TEI</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content imgslide"><h2>IIIF</h2><p class="lead">International Image Interoperability Framework</p><div class="ph" data-slot="dh-iiif"><small>Image</small>Example of IIIF</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content imgslide"><h2>MEI</h2><p class="lead">Music Encoding Initiative</p><div class="ph" data-slot="dh-mei"><small>Image</small>Example of MEI</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content center big">
<h2 id="distant-readingviewing">Distant Reading/Viewing</h2>
<p>Close reading is looking closely at a small selection of texts</p>
<p>Distance reading is looking &quot;softly&quot; at a large corpa of text</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content imgslide"><h2>Digital Newspaper Project</h2><p class="lead">How is one word used over time in every digitized newspaper? (Ryan Cordell's project)</p><div class="ph" data-slot="dh-newspaper"><small>Image</small>Digital Newspaper Project</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content imgslide"><h2>Postal Network Analysis</h2><p class="lead">How do postal networks confer power on royal families (Stanford project)</p><div class="ph" data-slot="dh-postal"><small>Image</small>Postal Network Analysis</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
<div class="content imgslide"><h2>Third Example of DH Project</h2><p class="lead">&nbsp;</p><div class="ph" data-slot="dh-third"><small>Image</small>Third example of a DH project</div></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-theme="m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h" lang="POSIX" style="--theme:m3pb3ri2wh700p1bz163m3w249rhl5f4le8vfhtux9h;">
